<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Login | CareCompass AI</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="auth-screen">
      <div class="auth-card">
        <div class="auth-copy">
          <div class="brand auth-brand">CareCompass AI</div>
          <h1>Your reports, per user</h1>
          <p>Sign in to keep reports, reminders, and health tracking isolated for each family member or account.</p>
        </div>
        <form id="authForm" class="auth-form">
          <h2 id="authTitle">Login</h2>
          <label id="displayNameField" hidden>Display name<input name="displayName" placeholder="Jane Rao" /></label>
          <label>Username<input name="username" placeholder="jane" required /></label>
          <label>Password<input name="password" type="password" placeholder="Minimum 4 characters" required /></label>
          <button type="submit" id="authSubmitButton">Login</button>
          <button type="button" id="authToggleButton" class="secondary">Create account instead</button>
          <div id="authMessage" class="auth-message">Use a separate login for each person's reports and reminders.</div>
        </form>
      </div>
    </section>

    <script src="/auth.js"></script>
  </body>
</html>
